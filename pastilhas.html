<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pastilhas - DDA Metalúrgica</title>

    <link rel="stylesheet" href="pastilhas.css">
</head>

<body>

    <!-- HEADER -->

    <header class="site-header">

        <div class="header-container">

            <div class="logo">

                <h1>DDA Metalúrgica</h1>

                <span>
                    Controle de Estoque
                </span>

            </div>


            <nav class="main-nav">

                <a href="painel.html" class="nav-link">
                    Dashboard
                </a>

                <a href="pastilhas.html" class="nav-link">
                    Pastilhas
                </a>

                <a href="fornecedores.html" class="nav-link">
                    Fornecedores
                </a>

                <a href="relatorios.html" class="nav-link">
                    Relatórios
                </a>

            </nav>

        </div>

    </header>

    <main class="main-container">

        <div class="page-header">

            <div class="page-title">

                <h2>
                    Pastilhas
                </h2>

                <p>
                    Gerenciamento do estoque de pastilhas.
                </p>

            </div>


            <div class="page-actions">

                <a href="#form-pastilha">
                    Nova Pastilha
                </a>

                <a href="#">
                    Entrada
                </a>

                <a href="#">
                    Saída
                </a>

            </div>

        </div>

        <section class="filter-panel">

            <div class="filter-group">

                <label for="busca">
                    Buscar
                </label>

                <input
                    type="text"
                    id="busca"
                    placeholder="Digite o código ou descrição"
                >

            </div>


            <div class="filter-group">

                <label for="status">
                    Status
                </label>

                <select id="status">

                    <option value="">
                        Todos
                    </option>

                    <option value="ok">
                        OK
                    </option>

                    <option value="baixo">
                        Baixo
                    </option>

                    <option value="critico">
                        Crítico
                    </option>

                </select>

            </div>


            <div class="filter-group">

                <label for="fabricante">
                    Fabricante
                </label>

                <select id="fabricante">

                    <option value="">
                        Todos
                    </option>

                    <option value="Sandvik">
                        Sandvik
                    </option>

                    <option value="Kennametal">
                        Kennametal
                    </option>

                    <option value="Iscar">
                        Iscar
                    </option>

                    <option value="Mitsubishi">
                        Mitsubishi
                    </option>

                </select>

            </div>

        </section>


        <!-- Lista de pastilhas -->

        <section class="panel">

            <div class="panel-header">

                <h3>
                    Itens em Estoque
                </h3>

                <span id="contador-pastilhas">
                    0 itens cadastrados
                </span>

            </div>


            <div
                id="lista-pastilhas"
                class="lista-pastilhas"
            >

            </div>

        </section>


        <!-- Formulário-->

        <section class="form-panel">

            <h3>
                Nova Pastilha
            </h3>


            <form id="form-pastilha">

                <div class="form-row">

                    <div class="form-group">

                        <label for="codigo">
                            Código
                        </label>

                        <input
                            type="text"
                            id="codigo"
                            placeholder="Ex: P-000"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="descricao">
                            Descrição
                        </label>

                        <input
                            type="text"
                            id="descricao"
                            placeholder="Ex: Pastilha TVHF 000000"
                            required
                        >

                    </div>

                </div>


                <div class="form-row">

                    <div class="form-group">

                        <label for="fabricante-novo">
                            Fabricante
                        </label>

                        <input
                            type="text"
                            id="fabricante-novo"
                            placeholder="Ex: Mitsubishi, Iscar..."
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="estoque-minimo">
                            Estoque mínimo
                        </label>

                        <input
                            type="number"
                            id="estoque-minimo"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="quantidade-inicial">
                            Quantidade inicial
                        </label>

                        <input
                            type="number"
                            id="quantidade-inicial"
                            required
                        >

                    </div>

                </div>


                <button type="submit">
                    Cadastrar Pastilha
                </button>

            </form>

        </section>

    </main>

    <footer class="site-footer">

        <p>
            DDA Metalúrgica - Controle de Estoque
        </p>

    </footer>

    <script src="pastilhas.js"></script>

</body>

</html>
